[build-system]
requires = ["setuptools>=77", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "breakcheck"
version = "2.0.1"
description = "Deterministic behavioral comparison for Python dependency and code changes."
requires-python = ">=3.10,<3.14"
dependencies = []
authors = [{name = "ViDale Lovett"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = [
  "behavioral-compatibility",
  "ci",
  "compatibility",
  "dependency-management",
  "deterministic",
  "offline",
  "python",
  "refactoring",
  "regression-testing",
  "testing",
  "upgrades",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "tomli>=2,<3; python_version < '3.11'",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
"breakcheck" = "breakcheck.cli:main"

[project.urls]
Homepage = "https://github.com/lovettsendit/breakcheck"
Repository = "https://github.com/lovettsendit/breakcheck"
Issues = "https://github.com/lovettsendit/breakcheck/issues"
Changelog = "https://github.com/lovettsendit/breakcheck/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
