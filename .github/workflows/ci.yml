name: Breakcheck CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and test tools
        run: python -m pip install "build>=1.2,<2" "pytest>=8,<9"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Create wheel test environment
        run: python -m venv "$RUNNER_TEMP/breakcheck-wheel"
      - name: Install wheel and test runner
        run: >-
          "$RUNNER_TEMP/breakcheck-wheel/bin/python" -m pip install
          dist/breakcheck-*.whl "pytest>=8,<9"
          "tomli>=2,<3; python_version < '3.11'"
      - name: Smoke-test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/breakcheck-wheel/bin/python" -c
          "import breakcheck; from breakcheck.cli import main; print(breakcheck.__file__)"
      - name: Test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/breakcheck-wheel/bin/python" -m pytest -q
          "$GITHUB_WORKSPACE/tests"
      - name: Create source-distribution test environment
        run: python -m venv "$RUNNER_TEMP/breakcheck-sdist"
      - name: Install source distribution
        run: >-
          "$RUNNER_TEMP/breakcheck-sdist/bin/python" -m pip install
          dist/breakcheck-*.tar.gz
      - name: Smoke-test installed source distribution outside checkout
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/breakcheck-sdist/bin/python" -c
          "import breakcheck; from breakcheck.cli import main; print(breakcheck.__file__)"
      - name: Check CLI help
        working-directory: ${{ runner.temp }}
        run: "$RUNNER_TEMP/breakcheck-wheel/bin/breakcheck --help"

  acceptance:
    name: demo and CLI acceptance
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install the public package
        run: python -m pip install --no-deps .
      - name: Check machine-readable capabilities
        working-directory: ${{ runner.temp }}
        run: breakcheck --capabilities --json
      - name: Run the offline changed-behavior demo
        working-directory: ${{ runner.temp }}
        run: breakcheck demo --output-root "$RUNNER_TEMP/breakcheck-demo"
