name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and test tools
        run: python -m pip install "build>=1.2,<2" "pytest>=8,<9"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Create wheel test environment
        run: python -m venv "$RUNNER_TEMP/breakcheck-wheel"
      - name: Install wheel and test runner
        run: >-
          "$RUNNER_TEMP/breakcheck-wheel/bin/python" -m pip install
          dist/breakcheck-*.whl "pytest>=8,<9"
      - name: Smoke-test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/breakcheck-wheel/bin/python" -c
          "import breakcheck; from breakcheck.cli import main; print(breakcheck.__file__)"
      - name: Test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/breakcheck-wheel/bin/python" -m pytest -q
          "$GITHUB_WORKSPACE/tests"
      - name: Create source-distribution test environment
        run: python -m venv "$RUNNER_TEMP/breakcheck-sdist"
      - name: Install source distribution
        run: >-
          "$RUNNER_TEMP/breakcheck-sdist/bin/python" -m pip install
          dist/breakcheck-*.tar.gz
      - name: Smoke-test installed source distribution outside checkout
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/breakcheck-sdist/bin/python" -c
          "import breakcheck; from breakcheck.cli import main; print(breakcheck.__file__)"
      - name: Check CLI help
        working-directory: ${{ runner.temp }}
        run: "$RUNNER_TEMP/breakcheck-wheel/bin/breakcheck --help"
